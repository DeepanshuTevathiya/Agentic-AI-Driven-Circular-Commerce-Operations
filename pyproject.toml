[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-consumption-pipeline"
version = "1.0.0"
description = "Autonomous Demand-Consumption Quick-Commerce Replenishment Pipeline"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "DeepMind & Antigravity Operations Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "click>=8.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "lightgbm>=4.0.0",
    "joblib>=1.3.0",
    "pyarrow>=10.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "httpx>=0.24.0",
]

[project.scripts]
agy-pipeline = "src.runtime.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

